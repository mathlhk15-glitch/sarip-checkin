<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026년 하반기 경남사립학교장회 정기총회 출석체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E5;
    --card:#FFFFFF;
    --ink:#1E2A44;
    --ink-2:#4C5A78;
    --brass:#A5822E;
    --brass-dark:#7E6423;
    --line:#E2DAC5;
    --success:#2F6B4F;
    --success-bg:#EAF3EE;
    --warn:#8C4A33;
    --warn-bg:#F6EBE5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:14px 8px 40px;
  }
  .sheet{
    width:100%;
    max-width:560px;
  }
  .crest{
    text-align:center;
    margin-bottom:16px;
  }
  .crest .org{
    font-size:16px;
    color:var(--ink-2);
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .crest h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:29px;
    line-height:1.38;
    margin:0 0 8px;
    color:var(--ink);
  }
  .crest .meta{
    font-size:15px;
    color:var(--ink-2);
  }
  .goldline{
    height:3px;
    width:56px;
    background:var(--brass);
    margin:14px auto 0;
    border-radius:2px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 16px 24px;
    margin-top:18px;
    box-shadow:0 1px 0 rgba(30,42,68,0.03);
  }
  #home-view .card{ min-height: 340px; }
  .search-wrap{ position:relative; }
  #searchInput{
    width:100%;
    font-family:inherit;
    font-size:22px;
    padding:20px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    outline:none;
    background:#FCFAF4;
    color:var(--ink);
  }
  #searchInput:focus{ border-color:var(--brass); background:#fff; }
  .hint{
    font-size:15px;
    color:var(--ink-2);
    margin-top:12px;
    text-align:center;
  }
  .chips{
    display:flex;
    gap:8px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .chip{
    font-size:16px;
    padding:11px 18px;
    border-radius:22px;
    border:1.3px solid var(--line);
    background:#FCFAF4;
    color:var(--ink-2);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .results{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:420px;
    overflow-y:auto;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 16px;
    border:1.3px solid var(--line);
    border-radius:12px;
    cursor:pointer;
    background:#FEFDFA;
  }
  .row:active{ background:#F6EFDB; }
  .row .who{ display:flex; flex-direction:column; gap:3px; }
  .row .school{ font-weight:700; font-size:19px; color:var(--ink); }
  .row .name{ font-size:16px; color:var(--ink-2); }
  .tag{
    font-size:13.5px;
    padding:6px 10px;
    border-radius:7px;
    background:#EFE9D6;
    color:var(--brass-dark);
    white-space:nowrap;
    font-weight:700;
  }
  .row.done{ opacity:0.55; }
  .row.done .tag{ background:var(--success-bg); color:var(--success); }
  .empty{
    text-align:center;
    color:var(--ink-2);
    font-size:16px;
    padding:34px 10px;
  }
  .helpline{
    text-align:center;
    font-size:15px;
    color:var(--ink-2);
    margin-top:24px;
    line-height:1.7;
  }
  .adminlink{
    display:block;
    text-align:center;
    font-size:13px;
    color:#B9AF95;
    margin-top:12px;
    text-decoration:none;
  }

  /* confirm / result views */
  .center-view{ display:none; text-align:center; }
  .center-view .card{ padding:38px 22px 32px; }
  .big-school{
    font-family:'Noto Serif KR', serif;
    font-size:26px;
    font-weight:700;
    margin:4px 0 2px;
  }
  .big-name{
    font-size:19px;
    color:var(--ink-2);
    margin-bottom:24px;
  }
  .confirm-q{ font-size:17px; color:var(--ink-2); margin-bottom:22px; }
  .btnrow{ display:flex; gap:10px; }
  button.primary, button.secondary{
    flex:1;
    font-family:inherit;
    font-size:18px;
    font-weight:700;
    padding:19px 10px;
    border-radius:12px;
    border:none;
    cursor:pointer;
  }
  button.primary{ background:var(--ink); color:#fff; }
  button.secondary{ background:#F0EBDA; color:var(--ink-2); }
  .icon-wrap{
    width:76px; height:76px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px;
  }
  .icon-wrap.ok{ background:var(--success-bg); }
  .icon-wrap.warn{ background:var(--warn-bg); }
  .status-line{ font-size:22px; font-weight:700; margin-bottom:6px; }
  .status-line.ok{ color:var(--success); }
  .status-line.warn{ color:var(--warn); }
  .time-line{ font-size:15.5px; color:var(--ink-2); margin-bottom:28px; }
  button.wide{
    width:100%;
    font-family:inherit;
    font-size:18px;
    font-weight:700;
    padding:19px 10px;
    border-radius:12px;
    border:none;
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }

  /* admin view */
  #admin-view{ display:none; }
  .stat-grid{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{
    flex:1;
    background:#FCFAF4;
    border:1.3px solid var(--line);
    border-radius:10px;
    padding:14px 10px;
    text-align:center;
  }
  .stat-box .num{ font-size:26px; font-weight:900; color:var(--ink); }
  .stat-box .lbl{ font-size:13px; color:var(--ink-2); margin-top:2px; }
  .progress-outer{
    height:10px; background:#EFE9D6; border-radius:6px; overflow:hidden; margin-bottom:18px;
  }
  .progress-inner{ height:100%; background:var(--brass); width:0%; transition:width .3s; }
  .admin-table{ max-height:420px; overflow-y:auto; }
  .admin-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 4px; border-bottom:1px solid var(--line); font-size:15px;
  }
  .admin-row .l{ color:var(--ink); font-weight:600; }
  .admin-row .r{ color:var(--ink-2); font-size:12px; }
  .admin-row.checked .r{ color:var(--success); font-weight:700; }
  .admin-actions{ display:flex; gap:8px; margin-top:14px; }
  .admin-actions button{
    flex:1; padding:10px; border-radius:8px; border:1.3px solid var(--line);
    background:#FCFAF4; font-family:inherit; font-size:13px; cursor:pointer; color:var(--ink-2);
  }
</style>
</head>
<body>

<div class="sheet">

  <div id="home-view">
    <div class="crest">
      <div class="org">경남사립학교장회</div>
      <h1>2026년 하반기 정기총회<br>출석 확인</h1>
      <div class="meta">일시·장소는 안내문을 확인해 주세요</div>
      <div class="goldline"></div>
    </div>

    <div class="card">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="학교명 또는 성함을 입력해 주세요" autocomplete="off">
      </div>
      <div class="hint">예) 거제고등학교 또는 김회진</div>
      <div class="chips">
        <div class="chip active" data-level="전체">전체</div>
        <div class="chip" data-level="초등학교">초등학교</div>
        <div class="chip" data-level="중학교">중학교</div>
        <div class="chip" data-level="고등학교">고등학교</div>
        <div class="chip" data-level="특수학교">특수학교</div>
      </div>
      <div class="results" id="results"></div>
    </div>

    <div class="helpline">
      검색이 어려우시면 등록 데스크 직원에게<br>말씀해 주시면 대신 도와드립니다.
    </div>
    <a class="adminlink" href="#" id="openAdmin">진행 현황</a>
  </div>

  <div id="confirm-view" class="center-view">
    <div class="card">
      <div class="confirm-q">아래 정보가 맞는지 확인해 주세요</div>
      <div class="big-school" id="cf-school"></div>
      <div class="big-name" id="cf-name"></div>
      <div class="btnrow">
        <button class="secondary" id="cf-cancel">다시 찾기</button>
        <button class="primary" id="cf-ok">네, 출석합니다</button>
      </div>
    </div>
  </div>

  <div id="result-view" class="center-view">
    <div class="card">
      <div class="icon-wrap" id="rv-icon"></div>
      <div class="status-line" id="rv-status"></div>
      <div class="big-school" id="rv-school"></div>
      <div class="big-name" id="rv-name"></div>
      <div class="time-line" id="rv-time"></div>
      <button class="wide" id="rv-close">확인</button>
    </div>
  </div>

  <div id="admin-view">
    <div class="crest">
      <div class="org">경남사립학교장회</div>
      <h1 style="font-size:20px;">진행 현황</h1>
      <div class="goldline"></div>
    </div>
    <div class="card">
      <div style="text-align:center;font-size:13px;color:var(--ink-2);margin-bottom:14px;">
        현재 진행 중인 행사: <strong id="currentEventName">-</strong>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="st-total">-</div><div class="lbl">전체 회원교</div></div>
        <div class="stat-box"><div class="num" id="st-done">-</div><div class="lbl">출석 완료</div></div>
        <div class="stat-box"><div class="num" id="st-pct">-</div><div class="lbl">출석률</div></div>
      </div>
      <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>
      <input id="adminSearch" type="text" placeholder="학교명·성함 검색" style="width:100%;padding:10px;border-radius:8px;border:1.3px solid var(--line);font-family:inherit;font-size:14px;margin-bottom:10px;">
      <div class="admin-table" id="adminTable"></div>
      <div class="admin-actions">
        <button id="adminRefresh">새로고침</button>
        <button id="adminCopy">출석자 명단 복사</button>
        <button id="adminCsv">CSV 다운로드</button>
      </div>
      <div class="admin-actions" style="margin-top:8px;">
        <button id="adminNewEvent" style="color:var(--warn);border-color:var(--warn-bg);">새 행사 시작</button>
        <button id="adminClose">닫기</button>
      </div>
    </div>
  </div>

</div>

const els = {
  home: document.getElementById('home-view'),
  confirm: document.getElementById('confirm-view'),
  result: document.getElementById('result-view'),
  admin: document.getElementById('admin-view'),
  search: document.getElementById('searchInput'),
  results: document.getElementById('results'),
  chips: document.querySelectorAll('.chip'),
};

let activeLevel = '전체';
let pending = null;
let checkedCache = {}; // no -> record, refreshed on demand

function norm(s){ return (s||'').toLowerCase().replace(/\s+/g,''); }

async function isChecked(no){
  try{
    const res = await fetch(`${GAS_URL}?action=check&no=${no}`);
    const data = await res.json();
    return data.checked ? data.record : null;
  }catch(e){
    console.error(e);
    return null;
  }
}

async function renderResults(){
  const q = norm(els.search.value);
  let list = SCHOOLS.filter(s => activeLevel==='전체' || s.level===activeLevel);
  if(q){
    list = list.filter(s => norm(s.school).includes(q) || norm(s.name).includes(q));
  }
  if(!q && activeLevel==='전체'){
    els.results.innerHTML = '<div class="empty">학교명 또는 성함을 입력하시면<br>목록이 나타납니다.</div>';
    return;
  }
  list = list.slice(0,30);
  if(list.length===0){
    els.results.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  els.results.innerHTML = '';
  for(const s of list){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="who">
        <div class="school">${s.school}</div>
        <div class="name">${s.name} 교장선생님 · ${s.region}</div>
      </div>
      <div class="tag">${s.level.replace('학교','')}</div>
    `;
    row.addEventListener('click', ()=> openConfirm(s));
    els.results.appendChild(row);
  }
}

function showView(name){
  els.home.style.display = name==='home' ? 'block' : 'none';
  els.confirm.style.display = name==='confirm' ? 'block' : 'none';
  els.result.style.display = name==='result' ? 'block' : 'none';
  els.admin.style.display = name==='admin' ? 'block' : 'none';
}

function openConfirm(school){
  pending = school;
  document.getElementById('cf-school').textContent = school.school;
  document.getElementById('cf-name').textContent = school.name + ' 교장선생님';
  showView('confirm');
}

document.getElementById('cf-cancel').addEventListener('click', ()=>{
  showView('home');
});

document.getElementById('cf-ok').addEventListener('click', async ()=>{
  if(!pending) return;
  document.getElementById('cf-ok').disabled = true;
  let data;
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'checkin', no:pending.no, school:pending.school, name:pending.name, level:pending.level, region:pending.region })
    });
    data = await res.json();
  }catch(e){
    document.getElementById('cf-ok').disabled = false;
    alert('네트워크 오류로 저장하지 못했습니다. 와이파이 연결을 확인하고 다시 눌러주세요.');
    return;
  }
  document.getElementById('cf-ok').disabled = false;
  if(data.status === 'duplicate'){
    document.getElementById('rv-icon').className = 'icon-wrap warn';
    document.getElementById('rv-icon').innerHTML = warnSvg();
    document.getElementById('rv-status').className = 'status-line warn';
    document.getElementById('rv-status').textContent = '이미 출석 확인되었습니다';
    document.getElementById('rv-school').textContent = pending.school;
    document.getElementById('rv-name').textContent = pending.name + ' 교장선생님';
    document.getElementById('rv-time').textContent = data.time + '에 확인됨';
    showView('result');
    return;
  }
  if(data.status === 'new'){
    document.getElementById('rv-icon').className = 'icon-wrap ok';
    document.getElementById('rv-icon').innerHTML = okSvg();
    document.getElementById('rv-status').className = 'status-line ok';
    document.getElementById('rv-status').textContent = '출석이 확인되었습니다';
    document.getElementById('rv-school').textContent = pending.school;
    document.getElementById('rv-name').textContent = pending.name + ' 교장선생님';
    document.getElementById('rv-time').textContent = data.time + ' 접수';
    showView('result');
    return;
  }
  alert('저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
});

document.getElementById('rv-close').addEventListener('click', ()=>{
  els.search.value = '';
  pending = null;
  renderResults();
  showView('home');
});

function okSvg(){
  return `<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#2F6B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function warnSvg(){
  return `<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 8.5V13" stroke="#8C4A33" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="16.3" r="1.3" fill="#8C4A33"/></svg>`;
}

els.search.addEventListener('input', renderResults);
els.chips.forEach(chip=>{
  chip.addEventListener('click', ()=>{
    els.chips.forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeLevel = chip.dataset.level;
    renderResults();
  });
});

async function startNewEventFlow(){
  const ok = confirm('새 행사를 시작하면 지금부터의 체크인은 새 시트에 쌓이고, 기존 출석 현황 화면은 0명으로 초기화됩니다.\\n지난 행사 기록은 구글시트에 그대로 남아있으니 걱정하지 않으셔도 됩니다.\\n계속하시겠습니까?');
  if(!ok) return;
  const name = prompt('이번 행사 이름을 입력해 주세요', '2026년 하반기 정기총회');
  if(!name) return;
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'newEvent', name })
    });
    const data = await res.json();
    if(data.status === 'ok'){
      alert('"' + data.event + '" 행사가 시작되었습니다.');
      await loadCurrentEventName();
      await loadAdmin();
    } else {
      alert('행사 시작에 실패했습니다. 다시 시도해 주세요.');
    }
  }catch(e){
    alert('네트워크 오류로 행사를 시작하지 못했습니다.');
  }
}

async function loadCurrentEventName(){
  try{
    const res = await fetch(`${GAS_URL}?action=currentEvent`);
    const data = await res.json();
    document.getElementById('currentEventName').textContent = data.event || '-';
  }catch(e){
    document.getElementById('currentEventName').textContent = '(불러오기 실패)';
  }
}

function copyAttendeeList(){
  const attendees = adminData.filter(r=>r.checked)
    .sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  if(attendees.length===0){ alert('아직 출석한 학교가 없습니다.'); return; }
  const lines = attendees.map((r,i)=> `${i+1}. ${r.school} ${r.name} 교장선생님 - ${r.time} 출석`);
  const text = `[출석 확인 명단] 총 ${attendees.length}명\\n` + lines.join('\\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> alert('출석자 명단이 복사되었습니다. 메모장이나 문서에 붙여넣기 하세요.'),
      ()=> promptFallback(text)
    );
  } else {
    promptFallback(text);
  }
}

function promptFallback(text){
  window.prompt('아래 내용을 직접 선택해 복사해 주세요 (Ctrl+C / Cmd+C)', text);
}

function downloadCsv(){
  if(adminData.length===0){ alert('데이터를 먼저 불러와 주세요.'); return; }
  const header = ['연번','지역','학교급','교명','성명','출석여부','출석시각'];
  const rows = [...adminData].sort((a,b)=> a.no-b.no).map(r=>[
    r.no, r.region, r.level, r.school, r.name, r.checked? '출석':'미확인', r.time||''
  ]);
  const csv = [header, ...rows].map(row =>
    row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
  ).join('\\r\\n');
  const blob = new Blob(['\\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const ymd = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `정기총회_출석현황_${ymd}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let adminData = [];

async function loadAdmin(){
  document.getElementById('adminTable').innerHTML = '<div class="empty">불러오는 중...</div>';
  let recordMap = {};
  try{
    const res = await fetch(`${GAS_URL}?action=all`);
    const data = await res.json();
    (data.records||[]).forEach(r => { recordMap[String(r.no)] = r.time; });
  }catch(e){
    document.getElementById('adminTable').innerHTML = '<div class="empty">불러오지 못했습니다. 새로고침을 다시 눌러주세요.</div>';
    return;
  }
  const results = SCHOOLS.map(s => ({ ...s, checked: !!recordMap[String(s.no)], time: recordMap[String(s.no)] || null }));
  adminData = results;
  const total = results.length;
  const done = results.filter(r=>r.checked).length;
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-done').textContent = done;
  document.getElementById('st-pct').textContent = total? Math.round(done/total*100)+'%' : '0%';
  document.getElementById('progressBar').style.width = (total? done/total*100 : 0) + '%';
  renderAdminTable();
}

function renderAdminTable(){
  const q = norm(document.getElementById('adminSearch').value);
  let list = adminData;
  if(q){
    list = list.filter(s => norm(s.school).includes(q) || norm(s.name).includes(q));
  }
  list = [...list].sort((a,b)=>{
    if(a.checked===b.checked) return a.school.localeCompare(b.school,'ko');
    return a.checked ? 1 : -1;
  });
  const box = document.getElementById('adminTable');
  box.innerHTML = '';
  for(const r of list){
    const row = document.createElement('div');
    row.className = 'admin-row' + (r.checked?' checked':'');
    row.innerHTML = `<div class="l">${r.school} · ${r.name}</div><div class="r">${r.checked ? r.time+' 완료' : '미확인'}</div>`;
    box.appendChild(row);
  }
}
